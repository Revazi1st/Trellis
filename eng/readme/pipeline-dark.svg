<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="706" viewBox="0 0 1200 706" role="img" aria-labelledby="title desc">
  <title id="title">One request through Trellis: paying an invoice</title>
  <desc id="desc">POST /api/v1/invoices/{id}/pay passes the host's hardening, the permission check and the idempotency filter, then the decorators Tracing, Logging, Validation, UnitOfWork around PayInvoiceCommandHandler, which calls Invoice.MarkPaid and gets a Result. The commit writes the invoices.paid.v1 event to the outbox in the same transaction; after the commit OutboxProcessor hands it to RecordMetricsOnInvoicePaid and SendReceiptOnInvoicePaid. A failed Result becomes an RFC 9457 problem.</desc>
