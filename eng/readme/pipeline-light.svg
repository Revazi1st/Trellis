<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="784" viewBox="0 0 1200 784" role="img" aria-labelledby="title desc">
  <title id="title">One request through Trellis: paying an invoice</title>
  <desc id="desc">A rail of numbered steps. POST /api/v1/invoices/{id}/pay passes the host's hardening, the permission check and the idempotency filter to the PayInvoice endpoint, then the decorators Tracing, Logging, Validation, UnitOfWork around PayInvoiceCommandHandler, which calls Invoice.MarkPaid and gets a Result. The commit writes the invoices.paid.v1 event to OutboxMessages in the same transaction; past the outbox boundary, OutboxProcessor hands it to SendReceiptOnInvoicePaid and RecordMetricsOnInvoicePaid, and SendReceiptOnInvoicePaid sends the receipt through IEmailSender.</desc>
