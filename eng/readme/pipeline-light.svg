  <text class="s22w600" x="32" y="54" fill="#14231b" letter-spacing="-0.44">One request: paying an invoice</text>
  <text class="s14" x="32" y="80" fill="#566b5f">POST /api/v1/invoices/{id}/pay, from the HTTP call to the receipt e-mail; every name is read from the code.</text>
  <text class="s12w600" x="80" y="120" fill="#14231b" letter-spacing="0.96">THE REQUEST<tspan class="s12" fill="#566b5f" letter-spacing="0">   the API host and the endpoint: Trellis.Api, Trellis.Api.Common</tspan></text>
  <text class="s14w600" x="128" y="194" fill="#14231b" text-anchor="middle">HTTP request</text>
  <text class="m12" x="128" y="212" fill="#14231b" text-anchor="middle">POST</text>
  <text class="m12" x="128" y="230" fill="#14231b" text-anchor="middle">/api/v1/invoices/{id}/pay</text>
  <text class="s14w600" x="328" y="194" fill="#14231b" text-anchor="middle">Hardening</text>
  <text class="m12" x="328" y="212" fill="#1c3654" text-anchor="middle">UseApiHardening</text>
  <text class="s13" x="328" y="230" fill="#566b5f" text-anchor="middle">headers, timeout, CORS</text>
  <text class="s14w600" x="528" y="194" fill="#14231b" text-anchor="middle">Permission</text>
  <text class="m12" x="528" y="212" fill="#1c3654" text-anchor="middle">RequirePermission</text>
  <text class="m12" x="528" y="230" fill="#1c3654" text-anchor="middle">invoices:write</text>
  <text class="s14w600" x="728" y="194" fill="#14231b" text-anchor="middle">Idempotency</text>
  <text class="m12" x="728" y="212" fill="#1c3654" text-anchor="middle">IdempotencyFilter</text>
  <text class="m12" x="728" y="230" fill="#1c3654" text-anchor="middle">Idempotency-Key</text>
  <text class="s14w600" x="928" y="194" fill="#14231b" text-anchor="middle">Endpoint</text>
  <text class="m12" x="928" y="212" fill="#1c3654" text-anchor="middle">PayInvoice</text>
  <text class="s13" x="928" y="230" fill="#566b5f" text-anchor="middle">maps the Result: a 204,</text>
  <text class="s13" x="928" y="248" fill="#566b5f" text-anchor="middle">or an RFC 9457 problem</text>
  <text class="s12w600" x="80" y="296" fill="#14231b" letter-spacing="0.96">THE USE CASE<tspan class="s12" fill="#566b5f" letter-spacing="0">   the decorators, outermost first, around the handler</tspan></text>
  <text class="s14w600" x="128" y="370" fill="#14231b" text-anchor="middle">Tracing</text>
  <text class="m12" x="128" y="388" fill="#4a3511" text-anchor="middle">TracingDecorators</text>
  <text class="s13" x="128" y="406" fill="#566b5f" text-anchor="middle">opens the use</text>
  <text class="s13" x="128" y="424" fill="#566b5f" text-anchor="middle">case's span</text>
  <text class="s14w600" x="304" y="370" fill="#14231b" text-anchor="middle">Logging</text>
  <text class="m12" x="304" y="388" fill="#4a3511" text-anchor="middle">LoggingDecorators</text>
  <text class="s13" x="304" y="406" fill="#566b5f" text-anchor="middle">writes its outcome line</text>
  <text class="s14w600" x="480" y="370" fill="#14231b" text-anchor="middle">Validation</text>
  <text class="m12" x="480" y="388" fill="#4a3511" text-anchor="middle">ValidationDecorators</text>
  <text class="s13" x="480" y="406" fill="#566b5f" text-anchor="middle">a 400 before</text>
  <text class="s13" x="480" y="424" fill="#566b5f" text-anchor="middle">the handler runs</text>
  <text class="s14w600" x="656" y="370" fill="#14231b" text-anchor="middle">UnitOfWork</text>
  <text class="m12" x="656" y="388" fill="#4a3511" text-anchor="middle">UnitOfWorkDecorators</text>
  <text class="s13" x="656" y="406" fill="#566b5f" text-anchor="middle">commits a</text>
  <text class="s13" x="656" y="424" fill="#566b5f" text-anchor="middle">success, once</text>
  <text class="s14w600" x="832" y="370" fill="#14231b" text-anchor="middle">Handler</text>
  <text class="m12" x="832" y="388" fill="#5a431a" text-anchor="middle">PayInvoiceCommandHandler</text>
  <text class="s13" x="832" y="406" fill="#566b5f" text-anchor="middle">loads the invoice</text>
  <text class="s14w600" x="1008" y="370" fill="#14231b" text-anchor="middle">Aggregate</text>
  <text class="m12" x="1008" y="388" fill="#4a3511" text-anchor="middle">Invoice.MarkPaid</text>
  <text class="s13" x="1008" y="406" fill="#566b5f" text-anchor="middle">changes state,</text>
  <text class="s13" x="1008" y="424" fill="#566b5f" text-anchor="middle">raises the event,</text>
  <text class="s13" x="1008" y="442" fill="#566b5f" text-anchor="middle">returns a Result</text>
  <text class="s12w600" x="80" y="488" fill="#14231b" letter-spacing="0.96">THE COMMIT</text>
  <text class="s12w600" x="276" y="488" fill="#14231b" letter-spacing="0.96">AFTER THE COMMIT<tspan class="s12" fill="#566b5f" letter-spacing="0">   at least once: the outbox, then the event's handlers</tspan></text>
  <text class="s14w600" x="128" y="562" fill="#14231b" text-anchor="middle">Commit</text>
  <text class="m12" x="128" y="580" fill="#163e39" text-anchor="middle">OutboxWriteInterceptor</text>
  <text class="s13" x="128" y="598" fill="#566b5f" text-anchor="middle">writes invoices.paid.v1</text>
  <text class="s13" x="128" y="616" fill="#566b5f" text-anchor="middle">to OutboxMessages</text>
  <text class="s13" x="128" y="634" fill="#566b5f" text-anchor="middle">with the invoice</text>
  <text class="s14w600" x="392" y="562" fill="#14231b" text-anchor="middle">Dispatch</text>
  <text class="m12" x="392" y="580" fill="#163e39" text-anchor="middle">OutboxProcessor</text>
  <text class="s13" x="392" y="598" fill="#566b5f" text-anchor="middle">claims the row, retries a failure</text>
  <text class="s14w600" x="656" y="562" fill="#14231b" text-anchor="middle">Event handlers</text>
  <text class="m12" x="656" y="580" fill="#5a431a" text-anchor="middle">SendReceiptOnInvoicePaid</text>
  <text class="m12" x="656" y="598" fill="#566b5f" text-anchor="middle">invoices.paid.send-receipt</text>
  <text class="m12" x="656" y="616" fill="#5a431a" text-anchor="middle">RecordMetricsOnInvoicePaid</text>
  <text class="m12" x="656" y="634" fill="#566b5f" text-anchor="middle">invoices.paid.record-metrics</text>
  <text class="s14w600" x="920" y="562" fill="#14231b" text-anchor="middle">Receipt e-mail</text>
  <text class="m12" x="920" y="580" fill="#2b4022" text-anchor="middle">IEmailSender</text>
  <text class="s13" x="920" y="598" fill="#566b5f" text-anchor="middle">logged until Email:Provider is Smtp</text>
