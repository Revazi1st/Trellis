  <title id="title">Trellis test suites and the layers each one runs</title>
  <desc id="desc">The rings of Trellis reduced to their names, with each test project drawn as a bracket around the layers it exercises: Domain.UnitTests, Application.UnitTests, IntegrationTests against PostgreSQL, ApiTests over HTTP in process, the opt-in UiTests in a browser and the opt-in Aspire end-to-end test, all inside the ArchitectureTests frame.</desc>
