<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1008" viewBox="0 0 1200 1008" role="img" aria-labelledby="title desc">
  <title id="title">Trellis test suites and the layers each one runs</title>
  <desc id="desc">The layers of a Trellis solution as a rail, from a browser to PostgreSQL, with ArchitectureTests above it as rules over every project; under it each test suite is a card spanning the layers it runs through, with what it needs: UiTests needs RUN_UI_TESTS=1; Aspire E2E needs RUN_ASPIRE_E2E=1; ApiTests needs Docker; IntegrationTests needs Docker; Application.UnitTests needs nothing; Domain.UnitTests needs nothing. The two opt-in suites are dashed.</desc>
