name: Template CI

on:
  push:
    branches: [main]
    paths: [".template.config/**", "eng/**", "XTemplate.slnx", ".github/workflows/template-ci.yml"]
  pull_request:
    branches: [main]
    paths: [".template.config/**", "eng/**", "XTemplate.slnx"]
  workflow_dispatch:

jobs:
  instantiate:
    name: Instantiate & build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
            out: Acme.Shop
          - name: no-ui
            args: "--include-ui false"
            out: Acme.Api
          - name: name-with-spaces
            args: ""
            out: "My Cool App"
          - name: no-ui-with-uitests
            # UI tests without the UI must degrade gracefully (the UiTests project is dropped).
            args: "--include-ui false --include-ui-tests true"
            out: Acme.Headless
          - name: all-options
            args: "--use-redis true --use-serilog true --use-multitenancy true --include-ui-tests true"
            out: Acme.Full
            # Build alone missed a runtime-only DI failure once (ITenantContext); run the generated tests too.
            test: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install template from source
        run: dotnet new install .

      - name: Instantiate
        # --allow-scripts yes: the chmod post-action otherwise prompts, and on a non-TTY
        # dotnet new loops forever on the unanswerable prompt.
        run: dotnet new xtemplate -n "${{ matrix.out }}" -o ../generated --allow-scripts yes ${{ matrix.args }}

      - name: Build generated solution
        working-directory: ../generated
        run: dotnet build *.slnx -c Release

      - name: Test generated solution
        if: ${{ matrix.test }}
        working-directory: ../generated
        # Aspire E2E and Playwright stay opt-in (not set here); everything else runs for real,
        # including the Testcontainers integration tests.
        run: dotnet test *.slnx -c Release --no-build

  pack:
    name: Pack template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack eng/XTemplate.TemplatePack/XTemplate.TemplatePack.csproj -o ./nupkg
      - name: Install packed template (smoke)
        run: dotnet new install ./nupkg/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: template-package
          path: ./nupkg/*.nupkg
