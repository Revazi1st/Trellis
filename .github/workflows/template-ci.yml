name: Template CI

# No paths filter on purpose: the toggle ON-branches (UseRedis, UseSerilog, UseMultitenancy,
# IncludeUiTests) compile only in this matrix, and an ordinary change under src/, tests/ or tools/
# breaks them as easily as a template.json edit does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the whole matrix as a gate before anything is published.
  workflow_call:
  # Once a night, after ci.yml's own nightly run: Dependabot's auto-merged bumps reach main through
  # the Actions token, which starts no push run, and the toggle-on legs compile only in this matrix.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

# When release.yml calls this workflow (workflow_call), github.workflow is the CALLER's name
# ("Release"), so the release gate runs in a group of its own: a push to main during a dry run on
# main cancels only an older push run of Template CI, never the release's template gate.
concurrency:
  group: template-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, like the actions: a mutable tag must not change what CI runs.
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

jobs:
  instantiate:
    name: Instantiate & build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # KEEP IN SYNC with scripts/test-template.sh, which runs these legs on a maintainer's machine:
      # it reads this list (one key per line, args in double quotes; a new key needs teaching there)
      # and its run_leg mirrors the Instantiate, Content gate, first-migration, Build, Format, Test and
      # browser steps below.
      matrix:
        include:
          - name: default
            args: ""
            out: Acme.Shop
            test: true
          - name: no-ui
            args: "--include-ui false"
            out: Acme.Api
            test: true
          - name: no-ui-with-uitests
            # UI tests without the UI must degrade gracefully (the UiTests project is dropped).
            args: "--include-ui false --include-ui-tests true"
            out: Acme.Headless
          - name: all-options
            args: "--use-redis true --use-serilog true --use-multitenancy true --include-ui-tests true"
            out: Acme.Full
            # Build alone missed a runtime-only DI failure once (ITenantContext); run the generated tests too.
            test: true
            # The one leg that has the UiTests project: its browser tests run too, against the generated
            # AppHost under its new name with every option on (the steps after the Aspire end-to-end).
            browser: true
          # Each option that is off by default, on alone with the UI off. Without these legs Redis,
          # Serilog and multi-tenancy were only ever all off or all on, and never without the UI, so
          # code that works only while another option is on too went unseen (ApiFactory's separate
          # UseRedis and UseMultitenancy blocks had only ever compiled together). With the legs above,
          # every pair of the five options meets in all four value combinations. Tested, not just
          # built, for the reason above; they run on every pull request (a public repository's
          # standard runners cost no Actions minutes).
          - name: no-ui-with-redis
            args: "--include-ui false --use-redis true"
            out: Acme.Ledger
            test: true
          - name: no-ui-with-serilog
            args: "--include-ui false --use-serilog true"
            # A name that sorts after Xunit, where the others sort before Microsoft: the format
            # check below holds at both ends of the alphabet.
            out: Zeta.Journal
            test: true
          - name: no-ui-with-multitenancy
            args: "--include-ui false --use-multitenancy true"
            out: Acme.Tenants
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install template from source
        run: dotnet new install .

      # No --allow-scripts: the template's chmod post-action is the dedicated chmod action,
      # which never prompts (a prompt on a non-TTY would hang dotnet new).
      - name: Instantiate
        run: dotnet new trellis -n "${{ matrix.out }}" -o ../generated ${{ matrix.args }}

      # Nothing in a generated project may still carry the template's name, unprocessed template
      # syntax, a maintainer-only script's name or files that never belong in a repository, and it
      # holds the one initial migration the leg's options ask for. The checks live in a maintainer-only
      # script, its header lists them, and scripts/test-template.sh runs the same script at this point
      # of every leg; it reads the folder the leg generated, with the name and the flags dotnet new got
      # above. ci.yml runs its self-test.
      - name: Content gate
        run: ./scripts/check-generated-content.sh ../generated "${{ matrix.out }}" ${{ matrix.args }}

      # The generated project's own repository checks must pass on the day it is created.
      - name: Generated ADR link check
        working-directory: ../generated
        run: bash scripts/check-adr-links.sh

      # The hooks run as executables, so this also proves the chmod post-action lists every one.
      - name: Generated hook self-test
        working-directory: ../generated
        run: bash scripts/check-hooks.sh

      # Run as an executable, so this also proves the chmod post-action lists it.
      - name: Generated doctor self-test
        working-directory: ../generated
        run: ./scripts/doctor.sh --self-test

      - name: Lint the generated workflows
        working-directory: ../generated
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color .github/workflows/*.yml

      # A generated project is the consumer's, not a copy of the template's repository: no line may
      # name the template or its maintainer except the two that must. LICENSE is the template's MIT
      # notice, copied verbatim (its copyright line), and the provenance marker records the template
      # package and repository (the marker file, and prose naming it). The project gets its own
      # README and an empty CHANGELOG instead of the maintainer's, and none of the template's
      # governance files; the marker records exactly the options this leg passed.
      - name: Template name leftovers and consumer files
        working-directory: ../generated
        env:
          LEG: ${{ matrix.name }}
          ARGS: ${{ matrix.args }}
        run: |
          fail=0
          marker=.trellis-template.json

          hits=$(grep -rIniE --exclude-dir=.git --exclude-dir=artifacts --exclude-dir=bin --exclude-dir=obj \
                   --exclude="$marker" 'trellis|Revazi1st' . \
                 | grep -vE '^\./LICENSE:[0-9]+:Copyright \(c\) [0-9]{4} Trellis contributors$' \
                 | sed 's/\.trellis-template\.json//g' \
                 | grep -iE 'trellis|Revazi1st' || true)
          if [ -n "$hits" ]; then
            count=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
            {
              echo "### $LEG: $count line(s) still mention 'trellis' or 'Revazi1st'"
              echo
              echo '```text'
              printf '%s\n' "$hits" | head -n 300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$count line(s) in the generated output still name the template or its maintainer (see the job summary)."
            fail=1
          fi

          if ! jq -e '.template.package != "" and .template.version != "" and (.options | type == "object")' "$marker" > /dev/null; then
            echo "::error::$marker is missing or does not record the template and its options."
            fail=1
          fi
          read -r -a passed <<< "$ARGS"
          for ((i = 0; i + 1 < ${#passed[@]}; i += 2)); do
            flag="${passed[i]}"
            value="${passed[i + 1]}"
            if ! jq -e --arg k "${flag#--}" --argjson v "$value" '.options[$k] == $v' "$marker" > /dev/null; then
              echo "::error::$marker does not record '$flag $value', which this leg passed."
              fail=1
            fi
          done

          if [ "$(grep -c '^## \[' CHANGELOG.md)" != 1 ] || ! grep -qx '## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::The generated CHANGELOG.md must start empty: one '## [Unreleased]' heading and nothing released."
            fail=1
          fi
          if ! grep -qF "$marker" README.md; then
            echo "::error::The generated README.md is not the consumer stub (it does not name $marker)."
            fail=1
          fi
          # A test sits under the generated name (tests/Acme.Shop.ArchitectureTests/), hence the unquoted
          # glob: a shipped copy expands it, and with none it stays literal, so -e is false.
          for f in CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md .github/CODEOWNERS .github/ISSUE_TEMPLATE docs/releasing.md .claude/rules/site.md eng/readme \
                   scripts/check-template-toggles.sh scripts/test-template.sh scripts/check-readme-sync.sh scripts/regenerate-initial-migrations.sh \
                   scripts/check-generated-content.sh .template.config site .github/workflows/site.yml \
                   docs/adr/0031-documentation-site.md tests/*.ArchitectureTests/MigrationSnapshotTests.cs; do
            if [ -e "$f" ]; then
              echo "::error::$f is the template repository's own material and must not ship."
              fail=1
            fi
          done

          exit "$fail"

      # A consumer's first migration on a tree nothing has built yet, as scripts/ef.sh runs it inside
      # the SDK container: dotnet-ef reads the project's metadata before it builds, and that needs the
      # restore's assets file (NETSDK1004 without it), so ef.sh restores the solution first. Read-only,
      # so the steps after it see the tree as generated. It is also the check that the initial
      # migration a leg ships matches that leg's model, so it runs on the default leg and on every
      # leg with multi-tenancy, whose migration is the second set the template keeps: this
      # repository's own tests build only the default model. KEEP IN SYNC with the command inside
      # ef.sh's sh -c, and with scripts/test-template.sh.
      # It is also the first step that compiles the generated project, and dotnet-ef says only "Build
      # failed" when the project does not compile. So a failure claims no cause: the annotation names
      # both outputs and what each means, and a build of the Persistence project then prints the
      # compiler's errors, if there are any.
      - name: First migration command on an unbuilt tree
        if: ${{ matrix.name == 'default' || contains(matrix.args, '--use-multitenancy true') }}
        working-directory: ../generated
        run: |
          rm -rf artifacts
          dotnet tool restore
          dotnet restore ./*.slnx --verbosity quiet
          if ! dotnet dotnet-ef migrations has-pending-model-changes --project src/Infrastructure/*.Persistence; then
            echo "::error::The first migration command failed (its output is above). If it says the model has pending changes, the initial migration this leg ships does not match its model: a model change regenerates both sets the template keeps, in the template repository: scripts/regenerate-initial-migrations.sh. If it says the build failed, this is the first step that compiles the generated project, and the compiler's errors follow."
            dotnet build src/Infrastructure/*.Persistence --nologo --verbosity quiet || true
            exit 1
          fi

      - name: Build generated solution
        working-directory: ../generated
        run: dotnet build ./*.slnx -c Release

      # The generated ci.yml's Format check, word for word, on every leg: a project must pass its own
      # format gate the day it is generated, whatever its name sorts next to (Microsoft, Xunit) and
      # whatever options it was generated with. KEEP IN SYNC with scripts/test-template.sh.
      - name: Format check (generated)
        working-directory: ../generated
        run: dotnet format ./*.slnx --no-restore --verify-no-changes --severity warn

      # Everything runs for real: the Testcontainers suites and the Aspire E2E (InvoiceApiFlowTests),
      # which boots the generated AppHost under its new name (PostgreSQL, the migration worker, the
      # API, the Valkey cache with --use-redis) as a consumer's first push to their own CI would. The E2E runs as
      # its own step after the suites, as the shipped ci.yml does: its processes and Testcontainers
      # would otherwise race for the same host ports. The AppHost starts Linux images, so that step
      # runs on Linux runners only (the Windows job below runs only the projects that need no Docker).
      # The browser tests stay out of this step (RUN_UI_TESTS is not set, so they skip): the leg that
      # has them runs them in the steps after the E2E. KEEP IN SYNC with scripts/test-template.sh.
      - name: Test generated solution
        if: ${{ matrix.test }}
        working-directory: ../generated
        run: dotnet test ./*.slnx -c Release --no-build

      - name: Aspire end-to-end (generated AppHost)
        if: ${{ matrix.test && runner.os == 'Linux' }}
        working-directory: ../generated
        env:
          RUN_ASPIRE_E2E: "1"
        run: dotnet test ./tests/*.ApiTests -c Release --no-build -- --filter-trait Category=AspireE2E --ignore-exit-code 8

      # The generated project's browser tests, as its own ci.yml's ui-tests job runs them: install the
      # browser, the first-run pictures in a run of their own, then every browser test. Each run starts
      # the generated AppHost itself (AppHostFixture) on a database of its own, so they come after the
      # E2E for the reason the E2E comes after the suites. KEEP IN SYNC with the ui-tests job of ci.yml
      # and with scripts/test-template.sh.
      - name: Install Playwright browsers (generated)
        if: ${{ matrix.browser }}
        working-directory: ../generated
        run: pwsh artifacts/bin/*.UiTests/release/playwright.ps1 install chromium --with-deps

      - name: Keep pictures of the first run (generated)
        if: ${{ matrix.browser }}
        working-directory: ../generated
        env:
          RUN_UI_TESTS: "1"
          UI_TESTS_FIRST_RUN: "1"
          UI_TESTS_SCREENSHOTS: ${{ runner.temp }}/generated-ui/screenshots
          UI_TESTS_LOGS: ${{ runner.temp }}/generated-ui/applogs/first-run
        run: dotnet test ./tests/*.UiTests -c Release --no-build --filter-class '*FirstRunPicturesTests'

      - name: Browser tests (generated)
        if: ${{ matrix.browser }}
        working-directory: ../generated
        env:
          RUN_UI_TESTS: "1"
          UI_TESTS_SCREENSHOTS: ${{ runner.temp }}/generated-ui/screenshots
          UI_TESTS_LOGS: ${{ runner.temp }}/generated-ui/applogs/browser-tests
        run: dotnet test ./tests/*.UiTests -c Release --no-build

      - name: Show the generated application's logs
        if: ${{ failure() && matrix.browser }}
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/generated-ui/applogs/*/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload the generated project's screenshots and logs
        if: ${{ always() && matrix.browser }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-ui-${{ matrix.name }}
          path: ${{ runner.temp }}/generated-ui
          retention-days: 14
          if-no-files-found: ignore

  # The default options on Windows: the template installs and instantiates there, the generated
  # solution builds, and the test projects that need no Docker pass (Windows runners cannot run the
  # Linux containers the integration and API tests start); then a multi-tenant project is created,
  # not built, to see its initial migration land in place (the last step). Every step is PowerShell
  # or a plain command, nothing that needs bash.
  instantiate-windows:
    name: Instantiate & build (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install template from source
        run: dotnet new install .

      - name: Instantiate
        run: dotnet new trellis -n Acme.Shop -o ../generated

      - name: Build generated solution
        working-directory: ../generated
        run: dotnet build Acme.Shop.slnx -c Release

      # One project at a time: PowerShell reports only the last command's exit code, so each one is
      # checked before the next runs.
      - name: Test generated solution (the projects that need no Docker)
        working-directory: ../generated
        run: |
          foreach ($project in 'Domain.UnitTests', 'Application.UnitTests', 'ArchitectureTests') {
            dotnet test "tests/Acme.Shop.$project" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The multi-tenant initial migration reaches a project through a source of its own in
      # template.json, conditional on the option, whose target folder the engine renames with the
      # project's name, beside a modifier that keeps the default set out. The Linux legs create, build
      # and test such a project; nothing shows the conditional source and its renamed target on
      # Windows, with its own paths. So this creates one from the same folder install (no build,
      # nothing restored) and checks where the set landed: one *.Persistence folder, whose Migrations
      # folder holds three files, a migration and its designer named after one id, and the snapshot
      # with the tenant columns.
      - name: Instantiate with multi-tenancy (where the initial migration lands)
        run: |
          dotnet new trellis -n Acme.Tenants -o ../generated-tenants --use-multitenancy true --skip-restore true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $persistence = @(Get-ChildItem -Path ../generated-tenants/src/Infrastructure -Directory -Filter '*.Persistence' -ErrorAction SilentlyContinue)
          $files = @()
          if ($persistence.Count -eq 1) {
            $files = @(Get-ChildItem -Path (Join-Path $persistence[0].FullName 'Migrations') -File -ErrorAction SilentlyContinue)
          }
          $ids = @($files | ForEach-Object { if ($_.Name -match '^(\d{14})_') { $Matches[1] } })
          $distinct = @($ids | Sort-Object -Unique)
          $snapshot = @($files | Where-Object { $_.Name -eq 'AppDbContextModelSnapshot.cs' })
          $tenant = ($snapshot.Count -eq 1) -and [bool](Select-String -LiteralPath $snapshot[0].FullName -Pattern '"TenantId"' -SimpleMatch -Quiet)
          if ($persistence.Count -ne 1 -or $files.Count -ne 3 -or $ids.Count -ne 2 -or $distinct.Count -ne 1 -or -not $tenant) {
            Write-Output "::error::A multi-tenant project created on Windows holds $($persistence.Count) *.Persistence folder(s) and $($files.Count) file(s) in its Migrations folder, $($ids.Count) of them named after $($distinct.Count) id(s), tenant columns in the snapshot: $tenant. It must hold one folder, and in it one migration, its designer and the multi-tenant snapshot (the sources of .template.config/template.json). The migration files it got:"
            Get-ChildItem -Path ../generated-tenants/src -Recurse -File -Filter '*.cs' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Migrations' } | ForEach-Object { $_.FullName }
            exit 1
          }

  pack:
    name: Pack & verify package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-dotnet
      - name: Toggle consistency check
        run: |
          chmod +x scripts/check-template-toggles.sh
          ./scripts/check-template-toggles.sh

      # The template-only workflows (this one, release.yml, site.yml) never reach a generated
      # project, so the instantiate legs do not lint them.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color .github/workflows/*.yml

      - name: Pack
        run: dotnet pack eng/Trellis.TemplatePack/Trellis.TemplatePack.csproj -o ./nupkg

      # The pack csproj has its own exclude list, separate from template.json's.
      - name: Package content gate
        run: |
          if unzip -Z1 ./nupkg/*.nupkg | grep -iE '(^|/)\.DS_Store$|(^|/)appsettings\.[^/]*\.local\.json$|\.pfx$'; then
            echo "::error::The package contains files that must never ship (listed above)."
            exit 1
          fi
          # The multi-tenant initial migration is a source of its own in template.json, and a template
          # whose source is missing does not load at all (MV012), whatever the options. grep reads the
          # whole listing (no -q), which is right in any shell. This job's steps run under Actions'
          # default bash -e, without pipefail (no shell key here, none under defaults): a pipeline's
          # status is its last command's, so the check that must fail the step is the last command of
          # its pipe, never the left side of one.
          if ! unzip -Z1 ./nupkg/*.nupkg | grep -x 'content/.template.config/tenancy/Migrations/AppDbContextModelSnapshot.cs' > /dev/null; then
            echo "::error::The package does not hold .template.config/tenancy/Migrations/, the multi-tenant initial migration."
            exit 1
          fi

      # The `instantiate` job validates the SOURCE tree (template.json's exclude list); real users
      # install the .nupkg, whose content set comes from the pack csproj — verify that artifact too.
      - name: Instantiate & build from the packed template
        run: |
          dotnet new install ./nupkg/*.nupkg
          dotnet new trellis -n Acme.Packed -o "$RUNNER_TEMP/packed" --skip-restore true
          dotnet build "$RUNNER_TEMP"/packed/*.slnx -c Release
          # The second set ships from the package too: a multi-tenant project gets it, and only it.
          dotnet new trellis -n Acme.PackedTenants -o "$RUNNER_TEMP/packed-tenants" --include-ui false --use-multitenancy true --skip-restore true
          set -- "$RUNNER_TEMP"/packed-tenants/src/Infrastructure/*.Persistence/Migrations/*.cs
          if [ "$#" -ne 3 ] || ! grep -q '"TenantId"' "$RUNNER_TEMP"/packed-tenants/src/Infrastructure/*.Persistence/Migrations/*ModelSnapshot.cs; then
            echo "::error::A multi-tenant project created from the package does not hold exactly the multi-tenant initial migration ($# file(s) under Migrations/)."
            exit 1
          fi

      # The regeneration script's own test, and one more hold on the two committed sets. It generates
      # both initial migrations as a maintainer's run does (a project per set, created from this tree's
      # package in a private hive), writes nothing, and fails unless every committed file is what it
      # generated, the id aside. A script that runs only when the model or the EF Core pin moves would
      # otherwise rot unseen between those runs; a set edited by hand fails here too. No database is
      # contacted.
      - name: Both shipped initial migrations are what the script generates
        run: |
          chmod +x scripts/regenerate-initial-migrations.sh
          ./scripts/regenerate-initial-migrations.sh --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-package
          path: ./nupkg/*.nupkg
