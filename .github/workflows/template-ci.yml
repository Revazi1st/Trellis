name: Template CI

# No paths filter on purpose: the toggle ON-branches (UseRedis, UseSerilog, UseMultitenancy,
# IncludeUiTests) compile only in this matrix, and an ordinary change under src/, tests/ or tools/
# breaks them as easily as a template.json edit does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the whole matrix as a gate before anything is published.
  workflow_call:
  # Once a night, after ci.yml's own nightly run: Dependabot's auto-merged bumps reach main through
  # the Actions token, which starts no push run, and the toggle-on legs compile only in this matrix.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

# When release.yml calls this workflow (workflow_call), github.workflow is the CALLER's name
# ("Release"), so the release gate runs in a group of its own: a push to main during a dry run on
# main cancels only an older push run of Template CI, never the release's template gate.
concurrency:
  group: template-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, like the actions: a mutable tag must not change what CI runs.
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

jobs:
  instantiate:
    name: Instantiate & build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
            out: Acme.Shop
            test: true
          - name: no-ui
            args: "--include-ui false"
            out: Acme.Api
            test: true
          - name: no-ui-with-uitests
            # UI tests without the UI must degrade gracefully (the UiTests project is dropped).
            args: "--include-ui false --include-ui-tests true"
            out: Acme.Headless
          - name: all-options
            args: "--use-redis true --use-serilog true --use-multitenancy true --include-ui-tests true"
            out: Acme.Full
            # Multi-tenancy adds columns, so the shipped initial migration is regenerated first.
            regenerate-migration: true
            # Build alone missed a runtime-only DI failure once (ITenantContext); run the generated tests too.
            test: true
          # Each option that is off by default, on alone with the UI off. Without these legs Redis,
          # Serilog and multi-tenancy were only ever all off or all on, and never without the UI, so
          # code that works only while another option is on too went unseen (ApiFactory's separate
          # UseRedis and UseMultitenancy blocks had only ever compiled together). With the legs above,
          # every pair of the five options meets in all four value combinations. Tested, not just
          # built, for the reason above; they run on every pull request (a public repository's
          # standard runners cost no Actions minutes).
          - name: no-ui-with-redis
            args: "--include-ui false --use-redis true"
            out: Acme.Ledger
            test: true
          - name: no-ui-with-serilog
            args: "--include-ui false --use-serilog true"
            out: Acme.Journal
            test: true
          - name: no-ui-with-multitenancy
            args: "--include-ui false --use-multitenancy true"
            out: Acme.Tenants
            regenerate-migration: true
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install template from source
        run: dotnet new install .

      # No --allow-scripts: the template's chmod post-action is the dedicated chmod action,
      # which never prompts (a prompt on a non-TTY would hang dotnet new).
      - name: Instantiate
        run: dotnet new trellis -n "${{ matrix.out }}" -o ../generated ${{ matrix.args }}

      # Nothing in a generated project may still carry the template's name, unprocessed template
      # syntax, or files that never belong in a repository. Build output (restore already ran as a
      # post-action) is skipped: it holds absolute runner paths, which contain the repository name.
      - name: Content gate
        working-directory: ../generated
        run: |
          fail=0
          prune=(-path ./.git -o -path ./artifacts -o -name bin -o -name obj)
          skip=(--exclude-dir=.git --exclude-dir=artifacts --exclude-dir=bin --exclude-dir=obj)

          # The provenance marker is named after the template on purpose (checked in the leftovers step).
          names=$(find . \( "${prune[@]}" \) -prune -o -iname '*trellis*' ! -path ./.trellis-template.json -print)
          if [ -n "$names" ]; then
            echo "::error::Generated files or directories still named after the template:"
            echo "$names"
            fail=1
          fi

          if grep -rInF "${skip[@]}" '#if (' .; then
            echo "::error::Unprocessed template conditionals in the generated output (listed above)."
            fail=1
          fi

          if grep -rInF "${skip[@]}" 'TRELLIS_' .; then
            echo "::error::TRELLIS_ tokens survived instantiation (listed above)."
            fail=1
          fi

          # The template does not ship its maintainer-only checks; a workflow step that runs one
          # belongs in a block conditioned on the TemplateSource symbol (see ci.yml).
          if grep -rInF 'check-template-toggles' .github; then
            echo "::error::Generated workflows reference scripts/check-template-toggles.sh, which the template does not ship (listed above)."
            fail=1
          fi

          junk=$(find . \( "${prune[@]}" \) -prune -o \( -name .DS_Store -o -name 'appsettings.*.local.json' -o -name '*.pfx' \) -print)
          if [ -n "$junk" ]; then
            echo "::error::Files that must never ship are in the generated output:"
            echo "$junk"
            fail=1
          fi

          exit "$fail"

      # The generated project's own repository checks must pass on the day it is created.
      - name: Generated ADR link check
        working-directory: ../generated
        run: bash scripts/check-adr-links.sh

      - name: Lint the generated workflows
        working-directory: ../generated
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color .github/workflows/*.yml

      # A generated project is the consumer's, not a copy of the template's repository: no line may
      # name the template or its maintainer except the two that must. LICENSE is the template's MIT
      # notice, copied verbatim (its copyright line), and the provenance marker records the template
      # package and repository (the marker file, and prose naming it). The project gets its own
      # README and an empty CHANGELOG instead of the maintainer's, and none of the template's
      # governance files; the marker records exactly the options this leg passed.
      - name: Template name leftovers and consumer files
        working-directory: ../generated
        env:
          LEG: ${{ matrix.name }}
          ARGS: ${{ matrix.args }}
        run: |
          fail=0
          marker=.trellis-template.json

          hits=$(grep -rIniE --exclude-dir=.git --exclude-dir=artifacts --exclude-dir=bin --exclude-dir=obj \
                   --exclude="$marker" 'trellis|Revazi1st' . \
                 | grep -vE '^\./LICENSE:[0-9]+:Copyright \(c\) [0-9]{4} Trellis contributors$' \
                 | sed 's/\.trellis-template\.json//g' \
                 | grep -iE 'trellis|Revazi1st' || true)
          if [ -n "$hits" ]; then
            count=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
            {
              echo "### $LEG: $count line(s) still mention 'trellis' or 'Revazi1st'"
              echo
              echo '```text'
              printf '%s\n' "$hits" | head -n 300
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$count line(s) in the generated output still name the template or its maintainer (see the job summary)."
            fail=1
          fi

          if ! jq -e '.template.package != "" and .template.version != "" and (.options | type == "object")' "$marker" > /dev/null; then
            echo "::error::$marker is missing or does not record the template and its options."
            fail=1
          fi
          read -r -a passed <<< "$ARGS"
          for ((i = 0; i + 1 < ${#passed[@]}; i += 2)); do
            flag="${passed[i]}"
            value="${passed[i + 1]}"
            if ! jq -e --arg k "${flag#--}" --argjson v "$value" '.options[$k] == $v' "$marker" > /dev/null; then
              echo "::error::$marker does not record '$flag $value', which this leg passed."
              fail=1
            fi
          done

          if [ "$(grep -c '^## \[' CHANGELOG.md)" != 1 ] || ! grep -qx '## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::The generated CHANGELOG.md must start empty: one '## [Unreleased]' heading and nothing released."
            fail=1
          fi
          if ! grep -qF "$marker" README.md; then
            echo "::error::The generated README.md is not the consumer stub (it does not name $marker)."
            fail=1
          fi
          for f in CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md .github/CODEOWNERS .github/ISSUE_TEMPLATE docs/releasing.md eng/readme; do
            if [ -e "$f" ]; then
              echo "::error::$f is the template repository's own material and must not ship."
              fail=1
            fi
          done

          exit "$fail"

      - name: Regenerate the initial migration
        if: ${{ matrix.regenerate-migration }}
        working-directory: ../generated
        # The same step docs/development.md tells consumers to run after enabling multi-tenancy.
        run: |
          dotnet tool restore
          dotnet dotnet-ef migrations remove --force --project src/Infrastructure/*.Persistence
          dotnet dotnet-ef migrations add InitialCreate --project src/Infrastructure/*.Persistence

      - name: Build generated solution
        working-directory: ../generated
        run: dotnet build ./*.slnx -c Release

      # Everything runs for real: the Testcontainers suites and the Aspire E2E (InvoiceApiFlowTests),
      # which boots the generated AppHost under its new name (PostgreSQL, the migration worker, the
      # API, Redis with --use-redis) as a consumer's first push to their own CI would. The AppHost
      # starts Linux images, so the E2E is switched on for Linux runners only and skips on any other
      # (the Windows job below runs only the projects that need no Docker). Playwright stays opt-in.
      - name: Test generated solution
        if: ${{ matrix.test }}
        working-directory: ../generated
        env:
          RUN_ASPIRE_E2E: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: dotnet test ./*.slnx -c Release --no-build

  # The default options on Windows: the template installs and instantiates there, the generated
  # solution builds, and the test projects that need no Docker pass (Windows runners cannot run the
  # Linux containers the integration and API tests start). Every step is PowerShell or a plain
  # command, nothing that needs bash.
  instantiate-windows:
    name: Instantiate & build (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install template from source
        run: dotnet new install .

      - name: Instantiate
        run: dotnet new trellis -n Acme.Shop -o ../generated

      - name: Build generated solution
        working-directory: ../generated
        run: dotnet build Acme.Shop.slnx -c Release

      # One project at a time: PowerShell reports only the last command's exit code, so each one is
      # checked before the next runs.
      - name: Test generated solution (the projects that need no Docker)
        working-directory: ../generated
        run: |
          foreach ($project in 'Domain.UnitTests', 'Application.UnitTests', 'ArchitectureTests') {
            dotnet test "tests/Acme.Shop.$project" -c Release --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  pack:
    name: Pack & verify package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Toggle consistency check
        run: |
          chmod +x scripts/check-template-toggles.sh
          ./scripts/check-template-toggles.sh

      # The template-only workflows (this one, release.yml) never reach a generated project, so
      # the instantiate legs do not lint them.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "$ACTIONLINT_IMAGE" -color .github/workflows/*.yml

      - name: Pack
        run: dotnet pack eng/Trellis.TemplatePack/Trellis.TemplatePack.csproj -o ./nupkg

      # The pack csproj has its own exclude list, separate from template.json's.
      - name: Package content gate
        run: |
          if unzip -Z1 ./nupkg/*.nupkg | grep -iE '(^|/)\.DS_Store$|(^|/)appsettings\.[^/]*\.local\.json$|\.pfx$'; then
            echo "::error::The package contains files that must never ship (listed above)."
            exit 1
          fi

      # The `instantiate` job validates the SOURCE tree (template.json's exclude list); real users
      # install the .nupkg, whose content set comes from the pack csproj — verify that artifact too.
      - name: Instantiate & build from the packed template
        run: |
          dotnet new install ./nupkg/*.nupkg
          dotnet new trellis -n Acme.Packed -o "$RUNNER_TEMP/packed" --skip-restore true
          dotnet build "$RUNNER_TEMP"/packed/*.slnx -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-package
          path: ./nupkg/*.nupkg
