name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    # Code scanning is a GitHub Advanced Security feature: free for PUBLIC repositories, paid for
    # private ones. While this repo is private the analysis itself succeeds but the SARIF upload
    # fails with "Code scanning is not enabled for this repository", turning every scheduled run
    # red (and mailing the owner weekly). Gate on visibility instead of deleting the workflow:
    # it stays dormant while private and starts working by itself the moment the repo goes public.
    if: github.event.repository.visibility == 'public'
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build Trellis.slnx -c Release
      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
