name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    # Code scanning is a GitHub Advanced Security feature: free for PUBLIC repositories, paid for
    # private ones. Without it the analysis itself succeeds but the SARIF upload fails with "Code
    # scanning is not enabled for this repository", turning every scheduled run red (and mailing
    # the owner weekly). So the job runs on a public repository, and on a private one only once
    # code scanning is licensed and switched on there and the CODEQL_ENABLED repository variable
    # (Settings > Secrets and variables > Actions > Variables) is set to true.
    if: github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true'
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: csharp
          build-mode: manual
          # The default suite plus the security-extended queries (more coverage, slightly more
          # false positives); findings land in the Security tab.
          queries: security-extended
      - name: Build
        run: dotnet build Trellis.slnx -c Release
      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
