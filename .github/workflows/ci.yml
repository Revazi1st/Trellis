name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — scanning the full history is the point. A secret that was committed and
      # then "removed" in a later commit is still in the history, and still compromised.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The official image rather than gitleaks-action: the action is free for personal repos but
      # requires a paid GITLEAKS_LICENSE for organisation-owned ones, which would turn this gate red
      # the day the repository moves. --redact keeps any finding out of the public log.
      # Pinned like the actions: the digest of the v8.30.1 multi-arch index, so a re-pushed tag
      # cannot change what CI runs. Dependabot does not read images named in a run script; to
      # bump, take the new digest from "docker buildx imagetools inspect ghcr.io/gitleaks/gitleaks:<tag>"
      # and re-run the scan over the tree and the full history before merging.
      - name: gitleaks
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A template installed from a NuGet package loses the Unix executable bit. The template's
      # chmod post-action restores it, but a host that skips post-actions (or a commit made on
      # Windows) does not, so set it explicitly and generated projects work regardless.
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trellis.slnx

      - name: Format check
        run: dotnet format Trellis.slnx --no-restore --verify-no-changes --severity warn

      - name: ADR link check
        run: ./scripts/check-adr-links.sh

#if (TemplateSource)
      # Template source only: TemplateSource is a constant that is false whenever dotnet new runs,
      # so generated projects (which ship neither .template.config nor this script) never see this
      # step. Here it keeps every template condition symbol declared and every toggle exposed, on
      # every PR rather than only when the template config changes.
      - name: Template toggle check
        run: ./scripts/check-template-toggles.sh

#endif
      - name: Build (warnings as errors)
        run: dotnet build Trellis.slnx --no-restore -c Release

      # ubuntu-latest ships a Docker daemon and this job has a local SDK, so Testcontainers
      # integration tests and the Aspire orchestration E2E both run here (ADR-0008).
      # Coverage is collected OUT of process (dotnet-coverage wraps the run): the in-process MTP
      # coverage extension aborts the xunit.v3 host, which is why coverage was absent for a while.
      # eng/coverage.runsettings limits it to the solution's own production code: no test
      # assemblies, no third-party packages that ship symbols, no migrations, no generated code.
      - name: Test (with coverage)
        id: test
        env:
          RUN_ASPIRE_E2E: "1"
        run: |
          dotnet tool restore
          settings=()
          if [ -f eng/coverage.runsettings ]; then
            settings=(--settings eng/coverage.runsettings)
          else
            echo "::warning::eng/coverage.runsettings is missing: coverage also measures test assemblies, third-party packages and migrations (the ring tables below skip the first two; migrations count toward the Infrastructure ring)."
          fi
          dotnet dotnet-coverage collect "${settings[@]}" -f cobertura -o coverage.cobertura.xml \
            "dotnet test Trellis.slnx --no-build -c Release -- --report-trx --results-directory TestResults"

      # From the TRX files the run wrote: totals per test project, skipped tests included, then every
      # failure with its message and stack trace, in the job summary and as annotations. It runs
      # whenever the tests ran, red or green, so a failure is read there instead of in the raw log.
      - name: Test summary
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: python3 .github/scripts/trx-summary.py TestResults

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.cobertura.xml
          retention-days: 14

      # Per-ring and per-assembly tables in the job summary, and a line-rate floor under each src/
      # ring. With the template's default options they measured, in October 2026: Core 97.5% of
      # 721 lines (SharedKernel, Domain, Application: the business rules, where tests are cheapest),
      # Infrastructure 94.2% of 976, Presentation 83.7% of 1682 (the Blazor UI is its least covered
      # part; 91.8% without it) and Shared 100% of 69. Each floor sits several points below, so an
      # option's extra code or an ordinary change does not trip it while untested code piling up
      # does. tools (the AppHost and the migration job) is reported, not gated: most of its
      # coverage comes from the Aspire E2E test. Raise a floor as coverage grows; never lower one
      # to get a change through.
      - name: Coverage summary and ring floors
        run: >-
          python3 .github/scripts/coverage-summary.py coverage.cobertura.xml
          --min-line-rate src/Core=90 --min-line-rate src/Infrastructure=85
          --min-line-rate src/Presentation=75 --min-line-rate src/Shared=80

      # A flaky Testcontainers/Aspire run must not have to be reproduced blind.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # The committed OpenAPI document is the API's public contract artifact (ADR-0013): regenerating
  # it against the running app catches accidental wire-contract changes. A job of its own, not a
  # step of the optional browser-test job, so every project keeps this gate whatever options
  # created it.
  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

#if (TemplateSource)
      # The Redis blocks in this file are actionable conditionals: their directive lines start with
      # a doubled hash, and dotnet new strips one leading hash from every line of the branch it
      # keeps (a doubled hash becomes a single one). Here the Redis lines stay comments and only the
      # PostgreSQL branch runs; a project generated with --use-redis gets the Redis branch instead.
      # Keep every hash in those branches either the leading one or doubled: the engine strips any
      # other single hash (check-template-toggles.sh enforces this).
#endif
##if (UseRedis)
#      ## The API's HybridCache L2 (AddRedisDistributedCache in Program.cs) needs Redis, which
#      ## docker-compose.yml starts under its redis profile on host port 6379.
#      - name: Start PostgreSQL and Redis
#        run: docker compose --profile redis up -d --wait postgres redis
##else
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
##endif

      - name: Build the API and the migration service
        run: |
          dotnet build src/Presentation/Api/Trellis.Api -c Release
          dotnet build tools/Trellis.MigrationService -c Release

      # The API's background services (outbox, data retention) query the schema from their first
      # tick, so the database is migrated before the API starts.
      - name: Migrate & seed
        env:
          DOTNET_ENVIRONMENT: Development
        run: dotnet run --project tools/Trellis.MigrationService -c Release --no-build --no-launch-profile -- "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres"

      - name: Start the API
        env:
          # The OpenAPI document is mapped only in Development.
          ASPNETCORE_ENVIRONMENT: Development
##if (UseRedis)
#          ## ConnectionStrings:cache, which AddRedisDistributedCache("cache") reads.
#          ConnectionStrings__cache: localhost:6379
##endif
        run: |
          mkdir -p "$RUNNER_TEMP/applogs"
          dotnet run --project src/Presentation/Api/Trellis.Api -c Release --no-build --no-launch-profile -- \
            "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres" \
            --urls http://localhost:5171 > "$RUNNER_TEMP/applogs/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5171/alive >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::group::api.log"; cat "$RUNNER_TEMP/applogs/api.log" || true; echo "::endgroup::"
          echo "::error::The API did not become ready (see the api.log group above)" && exit 1

      - name: OpenAPI contract diff
        run: |
          ./scripts/export-openapi.sh http://localhost:5171
          git diff --exit-code docs/api/openapi.v1.json || {
            echo "::error::The API's OpenAPI document changed. If intentional, regenerate docs/api/openapi.v1.json (scripts/export-openapi.sh) and commit it."
            exit 1
          }

  # The images a deploy ships, published the way docs/deployment.md publishes them and booted the
  # way it configures them. No other job runs dotnet publish or starts a host outside Development,
  # so a file missing from an image, a setting Production needs that the required-configuration
  # table does not name, or a host that boots only in Development surfaces here instead of on the
  # first deploy. It runs on every push and pull request; to spend fewer Actions minutes, give the
  # job "if: github.event_name == 'push'" and it runs on main only.
  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fixes the compose network's name (smoke_default): the containers below join it and reach
      # the database by its service name.
      COMPOSE_PROJECT_NAME: smoke
      SMOKE_NETWORK: smoke_default
      SMOKE_DB: Host=postgres;Port=5432;Database=trellis;Username=postgres;Password=postgres
      SMOKE_ADMIN_EMAIL: admin@example.com
      SMOKE_ADMIN_PASSWORD: Smoke-${{ github.run_id }}-Admin!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The commands docs/deployment.md gives, with a fixed repository and tag so the steps below
      # can name the images, and no registry: the SDK loads each image into the local Docker.
      - name: Publish the API and migration images
        run: |
          dotnet publish src/Presentation/Api/Trellis.Api /t:PublishContainer -c Release \
            -p:ContainerRepository=smoke/api -p:ContainerImageTag=ci
          dotnet publish tools/Trellis.MigrationService /t:PublishContainer -c Release \
            -p:ContainerRepository=smoke/migrations -p:ContainerImageTag=ci

#if (IncludeUI)
      - name: Publish the web image
        run: |
          dotnet publish src/Presentation/UI/Trellis.UI.Web /t:PublishContainer -c Release \
            -p:ContainerRepository=smoke/web -p:ContainerImageTag=ci

#endif
##if (UseRedis)
#      - name: Start PostgreSQL and Redis
#        run: docker compose --profile redis up -d --wait postgres redis
##else
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
##endif

      # The one-shot job every deploy runs first: it must exit 0. Outside Development it refuses to
      # seed the well-known default admin password, so it gets its own.
      - name: Migrate and seed (migrations image)
        run: |
          docker run --rm --network "$SMOKE_NETWORK" \
            -e "ConnectionStrings__trellis-db=$SMOKE_DB" \
            -e "Seed__AdminEmail=$SMOKE_ADMIN_EMAIL" \
            -e "Seed__AdminPassword=$SMOKE_ADMIN_PASSWORD" \
            smoke/migrations:ci

      # Production (nothing sets ASPNETCORE_ENVIRONMENT, as in a real deploy) with the API's required
      # settings from docs/deployment.md and nothing else. Every NAME__KEY variable of this step's
      # env goes to the container; the signing key is generated here, so no key is ever committed.
      - name: Start the API (api image)
        env:
          ConnectionStrings__trellis-db: ${{ env.SMOKE_DB }}
          Email__Provider: Logging
##if (UseRedis)
#          ## ConnectionStrings:cache, which AddRedisDistributedCache("cache") reads.
#          ConnectionStrings__cache: redis:6379
##endif
        run: |
          printf 'Authentication__SigningKey=%s\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/api.env"
          env | grep -E '^[A-Za-z][A-Za-z0-9]*__' >> "$RUNNER_TEMP/api.env"
          docker run -d --name smoke-api --network "$SMOKE_NETWORK" -p 8080:8080 \
            --env-file "$RUNNER_TEMP/api.env" smoke/api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/alive > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::The API container did not become live (its log is in the last step)" && exit 1

      # Readiness, database included; an RFC 9457 problem from the real pipeline; and a sign-in with
      # the account the migration job seeded, its token then used on a protected endpoint.
      - name: Probe the API
        run: |
          fail=0
          body="$RUNNER_TEMP/body"
          # expect STATUS MEDIA-TYPE LABEL CURL-ARGS...: one request, whose status and media type must
          # match. LABEL names it in the error, which never echoes the arguments (a password).
          expect() {
            local status="$1" media="$2" label="$3" got
            shift 3
            got=$(curl -sS -o "$body" -w '%{http_code} %{content_type}' "$@") || got="no response"
            case "$got" in
              "$status $media"*) return 0 ;;
            esac
            echo "::error::$label answered '$got', expected $status $media"
            cat "$body" 2>/dev/null; echo
            fail=1
            return 1
          }
          api=http://localhost:8080

          expect 200 text/plain "GET /health" "$api/health" || true

          if expect 401 application/problem+json "GET /api/v1/invoices/overdue without a token" \
              "$api/api/v1/invoices/overdue" \
              && ! jq -e '.status == 401 and (.code | type == "string")' "$body" > /dev/null; then
            echo "::error::The 401 body is not the API's problem document:"; cat "$body"; echo
            fail=1
          fi

          login=$(jq -nc --arg email "$SMOKE_ADMIN_EMAIL" --arg password "$SMOKE_ADMIN_PASSWORD" \
            '{email: $email, password: $password}')
          if expect 200 application/json "POST /api/v1/auth/login as the seeded admin" \
              -X POST -H 'Content-Type: application/json' -d "$login" "$api/api/v1/auth/login"; then
            token=$(jq -r '.accessToken' "$body")
            expect 200 application/json "GET /api/v1/invoices/overdue with the admin's token" \
              -H "Authorization: Bearer $token" "$api/api/v1/invoices/overdue" || true
          fi
          exit "$fail"

#if (IncludeUI)
      # The web host needs only the API's address, which service discovery reads. The probes: it is
      # ready, the framework script and static assets made it into the image, and the first page
      # (the sign-in page, after a redirect) renders in Production.
      - name: Start and probe the web host (web image)
        run: |
          docker run -d --name smoke-web --network "$SMOKE_NETWORK" -p 8081:8080 \
            -e Services__api__http__0=http://smoke-api:8080 smoke/web:ci
          web=http://localhost:8081
          for _ in $(seq 1 30); do
            curl -fsS "$web/alive" > /dev/null 2>&1 && break
            sleep 2
          done
          for path in /health /_framework/blazor.web.js /; do
            curl -fsSL -o /dev/null "$web$path" || {
              echo "::error::GET $path on the web host failed (its log is in the last step)"
              exit 1
            }
          done

#endif
      - name: Container logs
        if: failure()
        run: |
          for name in $(docker ps -a --filter name=smoke- --format '{{.Names}}'); do
            echo "::group::$name"; docker logs "$name" 2>&1 || true; echo "::endgroup::"
          done

  # The no-local-SDK path (scripts/dotnet.sh, ADR-0008) on a stock Linux Docker Engine, the host
  # where it breaks most easily: Testcontainers started from inside the SDK container reach their
  # sibling containers through host.docker.internal, which only Docker Desktop resolves unaided.
  sdk-container:
    name: SDK container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build the SDK image
        run: docker build -t trellis-sdk:10.0 scripts/sdk-image

      - name: Build (in the SDK container)
        run: ./scripts/dotnet.sh build Trellis.slnx

      - name: Integration tests (in the SDK container)
        run: ./scripts/dotnet.sh test tests/Trellis.IntegrationTests

#if (IncludeUiTests && IncludeUI)
  # Browser tests against the real API and Web hosts. A generated project carries this job only
  # when it was created with --include-ui-tests (and the UI); otherwise there is no UiTests project.
  ui-tests:
    name: Playwright UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

##if (UseRedis)
#      - name: Start PostgreSQL and Redis
#        run: docker compose --profile redis up -d --wait
##else
      - name: Start PostgreSQL
        run: docker compose up -d --wait
##endif

      - name: Build
        run: dotnet build Trellis.slnx -c Release

      - name: Migrate & seed
        env:
          DOTNET_ENVIRONMENT: Development
        run: dotnet run --project tools/Trellis.MigrationService -c Release --no-build --no-launch-profile -- "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres"

      - name: Start API and Web
        env:
          ASPNETCORE_ENVIRONMENT: Development
##if (UseRedis)
#          ## ConnectionStrings:cache for the API's Redis L2; the web host does not read it.
#          ConnectionStrings__cache: localhost:6379
##endif
        run: |
          mkdir -p "$RUNNER_TEMP/applogs"
          # Capture each host's output: when readiness times out, the startup exception is the only
          # thing that explains why, and a bare "did not become ready" hides it (a dependency bump
          # that breaks Program.cs looks identical to a slow boot otherwise).
          dotnet run --project src/Presentation/Api/Trellis.Api -c Release --no-build --no-launch-profile -- \
            "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres" \
            --urls http://localhost:5171 > "$RUNNER_TEMP/applogs/api.log" 2>&1 &
          Services__api__http__0=http://localhost:5171 \
            dotnet run --project src/Presentation/UI/Trellis.UI.Web -c Release --no-build --no-launch-profile -- \
            --urls http://localhost:5170 > "$RUNNER_TEMP/applogs/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5170/alive >/dev/null 2>&1 && curl -fsS http://localhost:5171/alive >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::group::api.log"; cat "$RUNNER_TEMP/applogs/api.log" || true; echo "::endgroup::"
          echo "::group::web.log"; cat "$RUNNER_TEMP/applogs/web.log" || true; echo "::endgroup::"
          echo "::error::API/Web did not become ready (see the api.log / web.log groups above)" && exit 1

      - name: Install Playwright browsers
        run: pwsh artifacts/bin/Trellis.UiTests/release/playwright.ps1 install chromium --with-deps

      - name: Run browser tests
        env:
          RUN_UI_TESTS: "1"
          UI_TESTS_BASE_URL: http://localhost:5170
        run: dotnet test tests/Trellis.UiTests -c Release --no-build

#endif
  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The docs-not-needed label is the documented escape hatch (ADR-0014) for refactors that
    # genuinely change no behavior.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'docs-not-needed')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Check feature docs are updated
        run: ./scripts/check-docs-drift.sh origin/${{ github.base_ref }}
