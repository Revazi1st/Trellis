name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — scanning the full history is the point. A secret that was committed and
      # then "removed" in a later commit is still in the history, and still compromised.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The official image rather than gitleaks-action: the action is free for personal repos but
      # requires a paid GITLEAKS_LICENSE for organisation-owned ones, which would turn this gate red
      # the day the repository moves. --redact keeps any finding out of the public log.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A template installed from a NuGet package loses the Unix executable bit. The template's
      # chmod post-action restores it, but a host that skips post-actions (or a commit made on
      # Windows) does not, so set it explicitly and generated projects work regardless.
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Trellis.slnx

      - name: Format check
        run: dotnet format Trellis.slnx --no-restore --verify-no-changes --severity warn

      - name: ADR link check
        run: ./scripts/check-adr-links.sh

      # Template source only: a generated project has no .template.config, so the step skips
      # itself there. Here it keeps every template condition symbol declared and every toggle
      # exposed, on every PR rather than only when the template config changes.
      - name: Template toggle check
        if: hashFiles('.template.config/template.json') != ''
        run: ./scripts/check-template-toggles.sh

      - name: Build (warnings as errors)
        run: dotnet build Trellis.slnx --no-restore -c Release

      # ubuntu-latest ships a Docker daemon and this job has a local SDK, so Testcontainers
      # integration tests and the Aspire orchestration E2E both run here (ADR-0008).
      # Coverage is collected OUT of process (dotnet-coverage wraps the run): the in-process MTP
      # coverage extension aborts the xunit.v3 host, which is why coverage was absent for a while.
      - name: Test (with coverage)
        env:
          RUN_ASPIRE_E2E: "1"
        run: |
          dotnet tool restore
          dotnet dotnet-coverage collect -f cobertura -o coverage.cobertura.xml \
            "dotnet test Trellis.slnx --no-build -c Release -- --report-trx --results-directory TestResults"

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.cobertura.xml

      # A flaky Testcontainers/Aspire run must not have to be reproduced blind.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # The committed OpenAPI document is the API's public contract artifact (ADR-0013): regenerating
  # it against the running app catches accidental wire-contract changes. A job of its own, not a
  # step of the optional browser-test job, so every project keeps this gate whatever options
  # created it.
  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Build the API and the migration service
        run: |
          dotnet build src/Presentation/Api/Trellis.Api -c Release
          dotnet build tools/Trellis.MigrationService -c Release

      # The API's background services (outbox, data retention) query the schema from their first
      # tick, so the database is migrated before the API starts.
      - name: Migrate & seed
        env:
          DOTNET_ENVIRONMENT: Development
        run: dotnet run --project tools/Trellis.MigrationService -c Release --no-build --no-launch-profile -- "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres"

      - name: Start the API
        env:
          # The OpenAPI document is mapped only in Development.
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          mkdir -p "$RUNNER_TEMP/applogs"
          dotnet run --project src/Presentation/Api/Trellis.Api -c Release --no-build --no-launch-profile -- \
            "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres" \
            --urls http://localhost:5171 > "$RUNNER_TEMP/applogs/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5171/alive >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::group::api.log"; cat "$RUNNER_TEMP/applogs/api.log" || true; echo "::endgroup::"
          echo "::error::The API did not become ready (see the api.log group above)" && exit 1

      - name: OpenAPI contract diff
        run: |
          ./scripts/export-openapi.sh http://localhost:5171
          git diff --exit-code docs/api/openapi.v1.json || {
            echo "::error::The API's OpenAPI document changed. If intentional, regenerate docs/api/openapi.v1.json (scripts/export-openapi.sh) and commit it."
            exit 1
          }

  # The no-local-SDK path (scripts/dotnet.sh, ADR-0008) on a stock Linux Docker Engine, the host
  # where it breaks most easily: Testcontainers started from inside the SDK container reach their
  # sibling containers through host.docker.internal, which only Docker Desktop resolves unaided.
  sdk-container:
    name: SDK container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build the SDK image
        run: docker build -t trellis-sdk:10.0 scripts/sdk-image

      - name: Build (in the SDK container)
        run: ./scripts/dotnet.sh build Trellis.slnx

      - name: Integration tests (in the SDK container)
        run: ./scripts/dotnet.sh test tests/Trellis.IntegrationTests

#if (IncludeUiTests && IncludeUI)
  # Browser tests against the real API and Web hosts. A generated project carries this job only
  # when it was created with --include-ui-tests (and the UI); otherwise there is no UiTests project.
  ui-tests:
    name: Playwright UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Build
        run: dotnet build Trellis.slnx -c Release

      - name: Migrate & seed
        env:
          DOTNET_ENVIRONMENT: Development
        run: dotnet run --project tools/Trellis.MigrationService -c Release --no-build --no-launch-profile -- "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres"

      - name: Start API and Web
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          mkdir -p "$RUNNER_TEMP/applogs"
          # Capture each host's output: when readiness times out, the startup exception is the only
          # thing that explains why, and a bare "did not become ready" hides it (a dependency bump
          # that breaks Program.cs looks identical to a slow boot otherwise).
          dotnet run --project src/Presentation/Api/Trellis.Api -c Release --no-build --no-launch-profile -- \
            "--ConnectionStrings:trellis-db=Host=localhost;Port=5433;Database=trellis;Username=postgres;Password=postgres" \
            --urls http://localhost:5171 > "$RUNNER_TEMP/applogs/api.log" 2>&1 &
          Services__api__http__0=http://localhost:5171 \
            dotnet run --project src/Presentation/UI/Trellis.UI.Web -c Release --no-build --no-launch-profile -- \
            --urls http://localhost:5170 > "$RUNNER_TEMP/applogs/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5170/alive >/dev/null 2>&1 && curl -fsS http://localhost:5171/alive >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::group::api.log"; cat "$RUNNER_TEMP/applogs/api.log" || true; echo "::endgroup::"
          echo "::group::web.log"; cat "$RUNNER_TEMP/applogs/web.log" || true; echo "::endgroup::"
          echo "::error::API/Web did not become ready (see the api.log / web.log groups above)" && exit 1

      - name: Install Playwright browsers
        run: pwsh artifacts/bin/Trellis.UiTests/release/playwright.ps1 install chromium --with-deps

      - name: Run browser tests
        env:
          RUN_UI_TESTS: "1"
          UI_TESTS_BASE_URL: http://localhost:5170
        run: dotnet test tests/Trellis.UiTests -c Release --no-build

#endif
  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The docs-not-needed label is the documented escape hatch (ADR-0014) for refactors that
    # genuinely change no behavior.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'docs-not-needed')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Check feature docs are updated
        run: ./scripts/check-docs-drift.sh origin/${{ github.base_ref }}
