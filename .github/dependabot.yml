version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # ONE group for the whole Microsoft/Aspire graph — deliberately coarse.
      #
      # Central Package Management with CentralPackageTransitivePinningEnabled turns any pin that
      # sits BELOW a transitive requirement into a hard NU1109 "package downgrade" build error.
      # Two traps make that easy to hit if these move in separate PRs:
      #   1. "Microsoft.Extensions.*" spans two independent version lines — the runtime/BCL packages
      #      (10.0.x) and the dotnet/extensions ones like ServiceDiscovery / Http.Resilience /
      #      Caching.Hybrid (10.x). Bumping the second line raises its floor on the first.
      #   2. Aspire is the loudest consumer of those floors: Aspire 13.4.6 wants
      #      Microsoft.Extensions.* >= 10.0.12, so an Aspire bump in isolation breaks restore.
      # Grouping them means one PR moves the pin and the requirement together. The same reasoning
      # covers IdentityModel/OpenApi, which are pinned only to satisfy AspNetCore's transitives.
      microsoft:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Extensions.*"
          - "Microsoft.IdentityModel.*"
          - "Microsoft.OpenApi"
          - "Aspire.*"
          - "Npgsql.*"
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      test:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn", "Bogus", "NetArchTest*"]
    # Never let bots cross the license ceilings (ADR-0011).
    ignore:
      - dependency-name: "MediatR"
      - dependency-name: "AutoMapper"
      - dependency-name: "FluentAssertions"
      - dependency-name: "MassTransit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The SDK image every build/test runs through (scripts/dotnet.sh, dev container, CI).
  - package-ecosystem: docker
    directory: "/scripts/sdk-image"
    schedule:
      interval: weekly

  # Dev-dependency images (postgres, redis) in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  # Dev container Features (.devcontainer/devcontainer.json is found from the repo root).
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
