version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per family keeps the noise down and respects the CPM setup.
      aspnetcore-efcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore.*", "Microsoft.Extensions.*", "Npgsql.*"]
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      test:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn", "Bogus", "NetArchTest*"]
    # Never let bots cross the license ceilings (ADR-0011).
    ignore:
      - dependency-name: "MediatR"
      - dependency-name: "AutoMapper"
      - dependency-name: "FluentAssertions"
      - dependency-name: "MassTransit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The SDK image every build/test runs through (scripts/dotnet.sh, dev container, CI).
  - package-ecosystem: docker
    directory: "/scripts/sdk-image"
    schedule:
      interval: weekly

  # Dev-dependency images (postgres, redis) in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  # Dev container Features (.devcontainer/devcontainer.json is found from the repo root).
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
