version: 2
# Every block titles its pull requests, and so the squash-merged commits, "build(deps): Bump ..."
# ("build(deps-dev): ..." for a development dependency): the Conventional Commits form. Without the
# setting Dependabot infers a style from the history, which can differ between ecosystems (a bare
# "Bump ..." for NuGet beside "build(deps): ..." for the actions).
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    # A new version waits a week before Dependabot proposes it (version updates only: a security
    # update still arrives at once), so a yanked or compromised release is usually gone by then.
    # The auto-merge workflow (.github/workflows/dependabot-auto-merge.yml) counts on this.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # ONE group for the whole Microsoft/Aspire graph — deliberately coarse.
      #
      # Central Package Management with CentralPackageTransitivePinningEnabled turns any pin that
      # sits BELOW a transitive requirement into a hard NU1109 "package downgrade" build error.
      # Two traps make that easy to hit if these move in separate PRs:
      #   1. "Microsoft.Extensions.*" spans two independent version lines — the runtime/BCL packages
      #      (10.0.x) and the dotnet/extensions ones like ServiceDiscovery / Http.Resilience /
      #      Caching.Hybrid (10.x). Bumping the second line raises its floor on the first.
      #   2. Aspire is the loudest consumer of those floors: Aspire 13.4.6 wants
      #      Microsoft.Extensions.* >= 10.0.12, so an Aspire bump in isolation breaks restore.
      # Grouping them means one PR moves the pin and the requirement together. The same reasoning
      # covers IdentityModel/OpenApi, which are pinned only to satisfy AspNetCore's transitives.
      # dotnet-ef is the local tool in .config/dotnet-tools.json (Dependabot's nuget ecosystem
      # reads that manifest); it moves with the EF Core runtime it scaffolds migrations for.
      microsoft:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"   # no dot: the bare Microsoft.EntityFrameworkCore too
          - "Microsoft.Extensions.*"
          - "Microsoft.IdentityModel.*"
          - "Microsoft.OpenApi"
          - "Aspire.*"
          - "Npgsql.*"
          - "dotnet-ef"
          - "MessagePack"   # transitive pin below Aspire.Hosting; must move with it
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      # Roslyn, for the in-repository analyzer (tools/Trellis.Analyzers, ADR-0030): Microsoft.CodeAnalysis.Common
      # sets the floor of Microsoft.CodeAnalysis.Analyzers, so the two move together. Only their patch
      # updates reach this group; see the ignore list below.
      roslyn:
        patterns: ["Microsoft.CodeAnalysis.*"]
      # xunit.v3 and Microsoft.Testing.Extensions.TrxReport both build on Microsoft.Testing.Platform
      # and must move together: a test-group PR that bumped xunit.v3 alone failed every test run with
      # "TypeLoadException: Could not load type 'IDataConsumer'".
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
          - "Microsoft.Playwright"
          - "Shouldly"
          - "NSubstitute"
          - "Testcontainers*"
          - "Respawn"
          - "NetArchTest*"
    # Never let bots cross the license ceilings (ADR-0011).
    ignore:
      - dependency-name: "MediatR"
      - dependency-name: "AutoMapper"
      - dependency-name: "FluentAssertions"
      - dependency-name: "MassTransit"
      - dependency-name: "Moq"
      # The Roslyn the analyzer references must stay at or below the compiler of the SDK in global.json:
      # an older compiler cannot load the analyzer, and Release turns that warning (CS9057) into an
      # error. It is raised by hand with an SDK bump (docs/development.md, "Bumping the SDK"); patch
      # updates stay allowed. When a microsoft-group PR fails restore with NU1109 on
      # Microsoft.CodeAnalysis.CSharp (EF Core Design raised its Roslyn floor), raise the pin in that
      # PR, still within the compiler's version.
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The packages whose major number is the .NET major (10.x on .NET 10) take their next major
      # with the next .NET, which also moves the SDK in global.json, the target framework and the SDK
      # image: a migration made by hand (docs/development.md, "Bumping the SDK"), not a bump. Proposed
      # anyway, one such major would turn the microsoft group's weekly pull request into a major that
      # waits for a person, holding back the patches that otherwise merge on their own. Patch and minor
      # updates still arrive. Aspire, IdentityModel, Microsoft.OpenApi and MessagePack number their
      # own majors, so they are not listed.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      # Outside the group, two more follow the .NET major: Asp.Versioning.Http 10.x targets net10.0
      # only, and Serilog.AspNetCore 10.x builds on the 10.x Microsoft.Extensions packages.
      - dependency-name: "Asp.Versioning.Http"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]

  # One weekly PR for all action bumps: they are SHA pins with version comments, reviewed together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    # A new version waits a week before Dependabot proposes it (version updates only: a security
    # update still arrives at once), so a yanked or compromised release is usually gone by then.
    # The auto-merge workflow (.github/workflows/dependabot-auto-merge.yml) counts on this.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The SDK pinned in global.json (setup-dotnet installs exactly this version in CI). Merging a
  # bump raises the minimum SDK every contributor and generated project needs, so review it as
  # such. Major versions (a new .NET, new target framework) are a deliberate migration, not a bump.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The SDK image every build/test runs through (scripts/dotnet.sh, dev container, CI).
  - package-ecosystem: docker
    directory: "/scripts/sdk-image"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    # A new version waits a week before Dependabot proposes it (version updates only: a security
    # update still arrives at once), so a yanked or compromised release is usually gone by then.
    # The auto-merge workflow (.github/workflows/dependabot-auto-merge.yml) counts on this.
    cooldown:
      default-days: 7
    # The tag is the .NET major (10.0). Dependabot still moves the digest when 10.0 is republished,
    # but not to 11.0, whose SDK global.json refuses: the image changes major with the SDK, by hand,
    # like the dotnet-sdk block above.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dev-dependency images (postgres, redis) in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7

  # Dev container Features (.devcontainer/devcontainer.json is found from the repo root).
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
#if (TemplateSource)

  # Template source only: the documentation site's npm packages (site/, ADR-0031), which a generated
  # project never has. None of these pull requests merges on its own (dependabot-auto-merge.yml waits
  # for a person on every npm update): Astro and Starlight are 0.x and the site's build leans on their
  # internals, so a bump is read, built and looked at first. The Astro family moves in one pull request,
  # because Starlight and the links validator each require a range of Astro.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-links-validator"
      fonts:
        patterns: ["@fontsource-variable/*"]
#endif
